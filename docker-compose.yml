version: "3.9"

services:
  # FastAPI backend
  api:
    build: .
    command: uvicorn App.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./App:/app/App        # hot-reload on code changes
      - ./Model:/app/Model    # mount model weights
    environment:
      - MODEL_PATH=Model/best_model.pth

  # Streamlit frontend
  frontend:
    build: .
    command: >
      streamlit run Frontend/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./Frontend:/app/Frontend
    environment:
      - BACKEND_URL=http://api:8000  # Docker service name resolves internally
    depends_on:
      - api
